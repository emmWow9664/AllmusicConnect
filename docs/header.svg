<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="AllmusicConnect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080F16"/>
      <stop offset="0.5" stop-color="#0C1721"/>
      <stop offset="1" stop-color="#0A2626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#39C5BB" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#39C5BB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FE3D9"/>
      <stop offset="1" stop-color="#25958E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39C5BB" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>

  <!-- 右侧：像素方块 + 音符，代表 Minecraft 客户端与音乐 -->
  <g>
    <rect x="1128" y="52" width="30" height="30" rx="5" fill="#39C5BB" fill-opacity="0.55"/>
    <rect x="1166" y="92" width="20" height="20" rx="4" fill="#7FE0D6" fill-opacity="0.35"/>
    <rect x="1196" y="60" width="24" height="24" rx="4" fill="#39C5BB" fill-opacity="0.22"/>
    <rect x="1150" y="252" width="26" height="26" rx="4" fill="#39C5BB" fill-opacity="0.4"/>
    <rect x="1190" y="284" width="18" height="18" rx="3" fill="#7FE0D6" fill-opacity="0.25"/>
    <rect x="1214" y="232" width="20" height="20" rx="4" fill="#39C5BB" fill-opacity="0.18"/>
  </g>
  <g transform="translate(1006,152)">
    <circle r="112" fill="#39C5BB" fill-opacity="0.07"/>
    <circle r="112" fill="none" stroke="#39C5BB" stroke-opacity="0.22" stroke-width="2"/>
    <g fill="#39C5BB">
      <rect x="-46" y="-84" width="8" height="112" rx="4"/>
      <rect x="44" y="-108" width="8" height="112" rx="4"/>
      <path d="M-46 -84L52 -108L52 -84L-46 -60Z"/>
      <ellipse cx="-58" cy="28" rx="21" ry="16" transform="rotate(-18 -58 28)"/>
      <ellipse cx="32" cy="4" rx="21" ry="16" transform="rotate(-18 32 4)"/>
    </g>
    <g fill="#8FF0E7" fill-opacity="0.5">
      <circle cx="62" cy="-62" r="5"/>
      <circle cx="82" cy="-40" r="4"/>
    </g>
  </g>

  <!-- 声波条 -->
  <g fill="#39C5BB" transform="translate(852,238)">
    <rect x="0" y="-12" width="6" height="24" rx="3" fill-opacity="0.3"/>
    <rect x="16" y="-26" width="6" height="38" rx="3" fill-opacity="0.42"/>
    <rect x="32" y="-44" width="6" height="56" rx="3" fill-opacity="0.58"/>
    <rect x="48" y="-20" width="6" height="32" rx="3" fill-opacity="0.36"/>
    <rect x="64" y="-34" width="6" height="46" rx="3" fill-opacity="0.48"/>
  </g>

  <!-- 文案 -->
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif">
    <rect x="72" y="88" width="6" height="84" rx="3" fill="url(#accent)"/>
    <text x="100" y="142" font-size="58" font-weight="700" fill="#F4FBFB" letter-spacing="0.5">AllmusicConnect</text>
    <text x="102" y="182" font-size="20" fill="#93B0B6">AllMusic 客户端增强模组 · 一键连接第三方独立音乐服务器</text>

    <g font-size="16" fill="#9BF0E8">
      <rect x="102" y="206" width="166" height="34" rx="17" fill="#39C5BB" fill-opacity="0.12" stroke="#39C5BB" stroke-opacity="0.38"/>
      <text x="126" y="229">Fabric 客户端模组</text>
      <rect x="280" y="206" width="214" height="34" rx="17" fill="#39C5BB" fill-opacity="0.12" stroke="#39C5BB" stroke-opacity="0.38"/>
      <text x="304" y="229">Minecraft 1.21 ~ 26.2</text>
      <rect x="506" y="206" width="150" height="34" rx="17" fill="#39C5BB" fill-opacity="0.12" stroke="#39C5BB" stroke-opacity="0.38"/>
      <text x="530" y="229">独立服务端模式</text>
      <rect x="668" y="206" width="96" height="34" rx="17" fill="#39C5BB" fill-opacity="0.12" stroke="#39C5BB" stroke-opacity="0.38"/>
      <text x="692" y="229">GPL-3.0</text>
    </g>
    <text x="102" y="284" font-size="16" fill="#6E8A92">github.com/emmWow9664/AllmusicConnect</text>
  </g>
</svg>